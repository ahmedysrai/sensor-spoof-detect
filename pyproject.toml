[project]
name = "spoofdet"
version = "0.0.1"
description = "GNSS, IMU and LiDAR spoofing detection by cross-checking sensors"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
spoofdet = "spoofdet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
